[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upmem_llm_framework"
version = "0.0.1"
authors = [
    { name = "Cristobal Ortega", email = "cortega@upmem.com" },
    { name = "Sylvan Brocard", email = "sbrocard@upmem.com" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "upmem",
    "llm",
    "transformer",
    "pytorch",
    "profiling",
    "accelerator",
]
description = """\
    UPMEM LLM Framework allows profiling PyTorch layers and functions\
    and simulate those layers/functions with a given hardware profile.\
    """
readme = "README.md"
dependencies = [
    "torch==2.7.0",
    "transformers==4.44.2",
    "jsonschema==4.23.0",
    "typer==0.12.5",
]
requires-python = ">=3.10"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3.10',
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.urls]
Homepage = "https://upmem.com"
Repository = "https://github.com/upmem/upmem_llm_framework"

[tool.setuptools.package-data]
include = [
    "src/upmem_llm_framework/architectures_schema.json",
    "src/upmem_llm_framework/sim_architectures.yaml",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests
    "T201", # print statements allowed in tests
]
